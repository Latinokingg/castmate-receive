<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CastMate Receiver</title>

  <!-- Google Cast Receiver SDK v3 -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --ember:       #E8651A;
      --ember-dark:  #C4500E;
      --navy:        #1A1A2E;
      --navy-light:  #2A2A3E;
      --white:       #FFFFFF;
      --cream:       #FFF8F3;
      --success:     #1D9E75;
      --danger:      #E24B4A;
      --muted:       rgba(255,255,255,0.55);
      --font-display: 'DM Sans', sans-serif;
      --font-body:    'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
      font-family: var(--font-body);
      color: var(--white);
    }

    /* ── Main layout ── */
    #castmate-receiver {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(135deg, #1A1A2E 0%, #2A1810 60%, #1A1A2E 100%);
    }

    /* ── Subtle grid texture overlay ── */
    #castmate-receiver::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,101,26,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,101,26,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── Ember glow top-left ── */
    #castmate-receiver::after {
      content: '';
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(232,101,26,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Top bar ── */
    #top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px 0;
      z-index: 10;
    }

    /* ── Logo area ── */
    #logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #logo-icon {
      width: 44px;
      height: 44px;
      background: var(--ember);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #logo-wordmark {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    /* ── Clock ── */
    #clock {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* ── Center content ── */
    #center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px;
      z-index: 10;
      position: relative;
    }

    /* ── Hotel logo placeholder ── */
    #hotel-logo {
      margin-bottom: 32px;
      display: none; /* shown when logo URL is set */
    }

    #hotel-logo img {
      max-height: 80px;
      max-width: 300px;
      object-fit: contain;
    }

    /* ── Welcome message ── */
    #welcome-message {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 700;
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 16px;
      text-shadow: 0 2px 40px rgba(0,0,0,0.4);
    }

    #welcome-sub {
      font-size: 22px;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 48px;
    }

    /* ── WiFi pill ── */
    #wifi-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 12px 28px;
      backdrop-filter: blur(10px);
    }

    #wifi-info svg {
      flex-shrink: 0;
      opacity: 0.8;
    }

    #wifi-text {
      font-size: 18px;
      color: var(--white);
    }

    #wifi-text span {
      font-weight: 600;
      color: var(--ember);
    }

    /* ── Bottom bar ── */
    #bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 48px 36px;
      z-index: 10;
    }

    /* ── QR code block ── */
    #qr-block {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    #qr-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    #qr-label .label-top {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #qr-label .label-main {
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
    }

    #qr-code-wrapper {
      background: var(--white);
      border-radius: 12px;
      padding: 10px;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qr-code-wrapper canvas,
    #qr-code-wrapper img {
      width: 90px;
      height: 90px;
    }

    /* ── Status pill ── */
    #status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(29,158,117,0.15);
      border: 1px solid rgba(29,158,117,0.3);
      border-radius: 100px;
      padding: 8px 20px;
      margin-bottom: 8px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    #status-text {
      font-size: 14px;
      color: var(--success);
      font-weight: 500;
    }

    /* ── Casting overlay ── */
    #casting-overlay {
      position: absolute;
      inset: 0;
      background: var(--navy);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #casting-overlay.active {
      display: flex;
    }

    #casting-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(232,101,26,0.2);
      border-top-color: var(--ember);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    #casting-label {
      font-size: 20px;
      color: var(--muted);
    }

    /* ── Push message overlay ── */
    #message-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
    }

    #message-overlay.active {
      display: flex;
    }

    #message-card {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 56px;
      max-width: 700px;
      width: 90%;
      text-align: center;
      box-shadow: 0 40px 120px rgba(0,0,0,0.5);
    }

    #message-card.urgent {
      border: 4px solid var(--danger);
    }

    #message-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #FFF0E6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    #message-icon.urgent-icon {
      background: #FEE2E2;
    }

    #message-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ember);
      margin-bottom: 12px;
    }

    #message-title.urgent-title {
      color: var(--danger);
    }

    #message-body {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.3;
    }

    /* ── Animations ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #center-content > * {
      animation: fadeIn 0.8s ease forwards;
    }
  </style>
</head>

<body>
  <!-- ── Main receiver screen ── -->
  <div id="castmate-receiver">

    <!-- Top bar: logo + clock -->
    <div id="top-bar">
      <div id="logo-area">
        <div id="logo-icon">
          <!-- Cast icon SVG -->
          <svg width="24" height="24" viewBox="0 0 36 36" fill="none">
            <circle cx="10" cy="18" r="3" fill="white"/>
            <path d="M16 18 Q20 10 28 8" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M16 18 Q21 16 28 14" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
            <path d="M16 18 Q21 22 28 22" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
            <path d="M16 18 Q20 26 28 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <circle cx="29" cy="8" r="2.5" fill="white"/>
            <circle cx="29" cy="14" r="2.5" fill="white" opacity="0.7"/>
            <circle cx="29" cy="22" r="2.5" fill="white" opacity="0.7"/>
            <circle cx="29" cy="28" r="2.5" fill="white"/>
          </svg>
        </div>
        <div id="logo-wordmark">CastMate</div>
      </div>
      <div id="clock" id="clock">--:--</div>
    </div>

    <!-- Center: welcome + wifi -->
    <div id="center-content">
      <!-- Hotel logo (shown when set via branding) -->
      <div id="hotel-logo">
        <img id="hotel-logo-img" src="" alt="Property logo" />
      </div>

      <div id="welcome-message">Welcome to Formosa Golf Resort</div>
      <div id="welcome-sub">Stream management made easy</div>

      <div id="wifi-info">
        <!-- WiFi icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <div id="wifi-text">
          WiFi: <span id="wifi-ssid">Formosa-Guest</span>
          &nbsp;·&nbsp;
          Password: <span id="wifi-password">paradise2025</span>
        </div>
      </div>
    </div>

    <!-- Bottom bar: status + QR -->
    <div id="bottom-bar">
      <div id="status-pill">
        <div id="status-dot"></div>
        <div id="status-text">Connected to CastMate</div>
      </div>

      <div id="qr-block">
        <div id="qr-label">
          <span class="label-top">Scan to connect</span>
          <span class="label-main">Cast from your phone</span>
        </div>
        <div id="qr-code-wrapper">
          <!-- QR code rendered here by JS -->
          <canvas id="qr-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Casting active overlay -->
    <div id="casting-overlay">
      <div id="casting-spinner"></div>
      <div id="casting-label">Loading content...</div>
    </div>

    <!-- Push message overlay -->
    <div id="message-overlay">
      <div id="message-card">
        <div id="message-icon">
          <!-- Bell icon -->
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8651A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div id="message-title">Message from the property</div>
        <div id="message-body">Your message will appear here.</div>
      </div>
    </div>

  </div><!-- end #castmate-receiver -->

  <!-- ── QR Code library (no npm needed) ── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // ── Config ── (update per device when backend is live)
    const CONFIG = {
      appId:          'D4B69672',
      deviceId:       'device-001',
      roomName:       'Room 101',
      propertyName:   'Formosa Golf Resort',
      welcomeMessage: 'Welcome to Formosa Golf Resort',
      wifiSSID:       'Formosa-Guest',
      wifiPassword:   'paradise2025',
      qrUrl:          'https://castmate.app/connect/device-001',
      wsUrl:          null, // set when backend is live e.g. wss://api.castmate.app/ws/device-001
      hotelLogoUrl:   null, // set via branding config
    };

    // ── Apply config to DOM ──
    function applyConfig(cfg) {
      document.getElementById('welcome-message').textContent = cfg.welcomeMessage;
      document.getElementById('wifi-ssid').textContent       = cfg.wifiSSID;
      document.getElementById('wifi-password').textContent   = cfg.wifiPassword;

      if (cfg.hotelLogoUrl) {
        document.getElementById('hotel-logo-img').src = cfg.hotelLogoUrl;
        document.getElementById('hotel-logo').style.display = 'block';
      }
    }

    // ── Clock ──
    function updateClock() {
      const now  = new Date();
      const h    = now.getHours().toString().padStart(2, '0');
      const m    = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // ── QR Code ──
    function renderQR(url) {
      const canvas = document.getElementById('qr-canvas');
      QRCode.toCanvas(canvas, url, {
        width:  90,
        margin: 1,
        color:  { dark: '#1A1A2E', light: '#FFFFFF' }
      }, function(err) {
        if (err) console.error('QR render error:', err);
      });
    }

    // ── Push message handler ──
    function showMessage(text, urgent = false, durationMs = 30000) {
      const overlay = document.getElementById('message-overlay');
      const card    = document.getElementById('message-card');
      const body    = document.getElementById('message-body');
      const title   = document.getElementById('message-title');
      const icon    = document.getElementById('message-icon');

      body.textContent = text;

      if (urgent) {
        card.classList.add('urgent');
        title.classList.add('urgent-title');
        title.textContent = 'Urgent Message';
        icon.classList.add('urgent-icon');
        icon.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E24B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
      } else {
        card.classList.remove('urgent');
        title.classList.remove('urgent-title');
        title.textContent = 'Message from the property';
        icon.classList.remove('urgent-icon');
      }

      overlay.classList.add('active');

      if (durationMs !== -1) {
        setTimeout(() => {
          overlay.classList.remove('active');
        }, durationMs);
      }
    }

    // ── WebSocket connection (stub — activates when wsUrl is set) ──
    let ws = null;

    function connectWebSocket() {
      if (!CONFIG.wsUrl) {
        console.log('[CastMate] No WebSocket URL configured — running in standalone mode.');
        return;
      }

      ws = new WebSocket(CONFIG.wsUrl);

      ws.onopen = () => {
        console.log('[CastMate] WebSocket connected.');
        document.getElementById('status-text').textContent = 'Connected to CastMate';
        // Register this device with the backend
        ws.send(JSON.stringify({
          type:     'register',
          deviceId: CONFIG.deviceId,
          room:     CONFIG.roomName,
          property: CONFIG.propertyName,
        }));
      };

      ws.onmessage = (event) => {
        try {
          const cmd = JSON.parse(event.data);
          handleCommand(cmd);
        } catch (e) {
          console.error('[CastMate] Invalid command received:', e);
        }
      };

      ws.onclose = () => {
        console.log('[CastMate] WebSocket disconnected. Reconnecting in 5s...');
        document.getElementById('status-text').textContent = 'Reconnecting...';
        document.getElementById('status-dot').style.background = '#E8651A';
        setTimeout(connectWebSocket, 5000);
      };

      ws.onerror = (err) => {
        console.error('[CastMate] WebSocket error:', err);
      };
    }

    // ── Command handler ──
    function handleCommand(cmd) {
      console.log('[CastMate] Command received:', cmd);

      switch (cmd.type) {

        case 'push_message':
          showMessage(
            cmd.text,
            cmd.urgent || false,
            cmd.duration ? cmd.duration * 1000 : 30000
          );
          break;

        case 'update_branding':
          if (cmd.welcomeMessage) {
            document.getElementById('welcome-message').textContent = cmd.welcomeMessage;
          }
          if (cmd.wifiSSID) {
            document.getElementById('wifi-ssid').textContent = cmd.wifiSSID;
          }
          if (cmd.wifiPassword) {
            document.getElementById('wifi-password').textContent = cmd.wifiPassword;
          }
          if (cmd.hotelLogoUrl) {
            document.getElementById('hotel-logo-img').src = cmd.hotelLogoUrl;
            document.getElementById('hotel-logo').style.display = 'block';
          }
          break;

        case 'push_url':
          // Navigate the receiver to a URL (web page, menu, etc.)
          window.location.href = cmd.url;
          break;

        case 'reset':
          // Reload the receiver back to idle screen
          window.location.reload();
          break;

        case 'ping':
          // Respond to backend heartbeat check
          ws.send(JSON.stringify({ type: 'pong', deviceId: CONFIG.deviceId }));
          break;

        default:
          console.warn('[CastMate] Unknown command type:', cmd.type);
      }
    }

    // ── Google Cast Receiver SDK ──
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // When a sender connects
    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (event) => {
      console.log('[CastMate] Sender connected:', event.senderId);
    });

    // When a sender disconnects
    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (event) => {
      console.log('[CastMate] Sender disconnected:', event.senderId);
    });

    // When media starts loading — show casting overlay
    playerManager.addEventListener(cast.framework.events.EventType.MEDIA_STATUS, (event) => {
      const overlay = document.getElementById('casting-overlay');
      if (event.mediaStatus && event.mediaStatus.playerState === 'PLAYING') {
        overlay.classList.add('active');
      } else {
        overlay.classList.remove('active');
      }
    });

    // Start the Cast receiver
    context.start({
      disableIdleTimeout: true, // keep receiver alive indefinitely
    });

    // ── Init ──
    applyConfig(CONFIG);
    renderQR(CONFIG.qrUrl);
    connectWebSocket();

    console.log('[CastMate] Receiver v1.0 initialised. App ID: D4B69672');
  </script>
</body>
</html>
